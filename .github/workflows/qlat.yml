        sudo apt-get install -y libopenmpi-dev ninja-build patchelf libeigen3-dev libgsl-dev zlib1g-dev libssl-dev libmpfr-dev
        sudo apt-get install -y libfftw3-dev
        sudo apt-get install -y clang libomp-dev
        # sudo apt-get install -y gnuplot poppler-utils
    - name: Download dependencies
      run: |
        ./scripts/download-core.sh
    - name: Show versions for dependencies
      run: |
        ./scripts/update-sources.sh
    - name: Build default-gpt
      run: |
        export num_proc=2
        export prefix=~/qlat-build/default
        ./build.sh default-gpt
    - name: Show python venv
      run: |
        source ~/qlat-build/default/setenv.sh
        python3 -c "import sys; print(sys.version)"
        python3 -c "import sys; print(sys.path)"
        python3 -c "import numpy as np ; np.show_config()"
        python3 -c 'import sys ; from mesonbuild import mesonmain; sys.exit(mesonmain.main())' --version
        type ninja
        ninja --version
    - name: Testing pylib qlat
      # Cap this step so a hung worker pool fails the step (and the
      # failure-only debug steps at the end of the job run) instead of
      # burning GitHub's 6 h job limit without producing any log.
      timeout-minutes: 150
      run: |
        export num_proc=2
        export prefix=~/qlat-build/default
        ./scripts/qlat-examples-py.sh
    - name: Testing pylib qlat cps
      timeout-minutes: 150
      run: |
        export num_proc=2
        export prefix=~/qlat-build/default
        ./scripts/qlat-examples-py-cps.sh
    - name: Testing pylib qlat gpt
      timeout-minutes: 150
      run: |
        export num_proc=2
        export prefix=~/qlat-build/default
        ./scripts/qlat-examples-py-gpt.sh
    - name: Testing qlat
      run: |
        export num_proc=2
        export prefix=~/qlat-build/default
        ./scripts/qlat-examples-cpp.sh
    - name: Testing qlat grid
      run: |
        export num_proc=2
        export prefix=~/qlat-build/default
        ./scripts/qlat-examples-cpp-grid.sh
    - name: Check log diff
      run: |
        export prefix=~/qlat-build/default
        ./scripts/qlat-examples-diff-new-logs.sh
    - name: Update log
      run: |
        export prefix=~/qlat-build/default
        ./scripts/qlat-examples-update-logs.sh
    - name: Check error
      run: |
        git diff
        ! git diff | grep '^[+-]CHECK: ' # || echo "Check failed!"
    - name: Build more packages Grid
      run: |
        source ~/qlat-build/default/setenv.sh
        export num_proc=2
        export prefix=~/qlat-build/hadrons
        ./scripts/setenv.default.sh
        USE_COMPILER=clang ./scripts/grid.avx2.sh
    - name: Build more packages Hadrons
      run: |
        source ~/qlat-build/default/setenv.sh
        export num_proc=2
        export prefix=~/qlat-build/hadrons
        USE_COMPILER=clang ./scripts/hadrons.sh
    - name: Build more packages Grid-tblum
      run: |
        source ~/qlat-build/default/setenv.sh
        export num_proc=2
        export prefix=~/qlat-build/tblum
        ./scripts/setenv.default.sh
        USE_COMPILER=clang ./scripts/grid-tblum.avx2.sh
    - name: Build more packages Hadrons-tblum
      run: |
        source ~/qlat-build/default/setenv.sh
        export num_proc=2
        export prefix=~/qlat-build/tblum
        USE_COMPILER=clang ./scripts/hadrons-tblum.sh
    - name: Check error for Build more packages
      run: |
        for path in $HOME/qlat-build/{default/gpt/lib/python3/dist-packages/{cgpt.so,gpt/__init__.py},{default/Grid-clehner,hadrons/Grid,tblum/Grid-tblum}/{lib/libGrid.a,bin/{grid-config,Benchmark_dwf_fp32}},{hadrons/Hadrons,tblum/Hadrons-tblum}/{lib/libHadrons.a,bin/{hadrons-config,HadronsXmlRun,HadronsContractor}}} ; do if [ -e "$path" ] ; then echo "Build '$path' successfully." ; else echo "Failed to build '$path'." ; fi ; done
    - name: "Debug: dump full test logs and Python/MPI environment"
      # Failure-only: print the complete (untruncated) log of every failed or
      # killed test plus the Python/MPI environment, then upload it as an
      # artifact.  The Makefiles only show `tail -n 100` on failure, which hid
      # the real Python-3.14 exception (tmp/recon-findings.md).
      if: failure()
      run: |
        # -e is on for these steps; keep the environment dump best-effort.
        set +e
        # shellcheck disable=SC1090
        if [ -f ~/qlat-build/default/setenv.sh ] ; then source ~/qlat-build/default/setenv.sh ; fi
        echo "===== Python / MPI environment ====="
        echo "python3: $(command -v python3 || true)"
        python3 -VV || true
        python3 -c "import sys ; print(sys.version) ; print(sys.path)" || true
        python3 -c "import multiprocessing as mp ; print('mp.get_start_method() =', mp.get_start_method()) ; print('mp.get_all_start_methods() =', mp.get_all_start_methods())" || true
        mpiexec --version || true
        ulimit -c || true
        ulimit -a || true
        uname -a || true
        echo "===== full logs of failed/incomplete tests ====="
        bash scripts/ci-debug-collect-logs.sh "$HOME/qlat-build/default" "$RUNNER_TEMP/qlat-debug"
    - name: "Debug: upload failure logs"
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: qlat-debug-logs-build_qlat_gpt_ubuntu
        path: ${{ runner.temp }}/qlat-debug/
        if-no-files-found: ignore
        retention-days: 14
  build_pip_ubuntu:
