  build_nix_mac_clang:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-26.05
    - name: Check disk space
      run: df -h
    - name: Build qlat
      # --keep-failed keeps the failed build directory, including the full
      # per-test logs of the failed example tests, for the debug step below.
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-std-clang-ucxless.qlat-env -j 1 --cores 3 --keep-failed
    - name: Check disk space
      run: df -h
    - name: Test qlat
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-std-clang-ucxless.qlat-tests -j 1 --cores 3 --keep-failed
    - name: Check disk space
      run: df -h
    - name: Build qlat with GPT and CPS
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-cpsless-clang-ucxless.qlat-env -j 1 --cores 3 --keep-failed
    - name: Check disk space
      run: df -h
    - name: Test qlat with GPT and CPS
      # Non-gating since e4b22e86 (2026-06-02): every qlat_gpt example traps
      # with SIGTRAP (exit 133) in cgpt.copy_create_plan on the Nix
      # aarch64-darwin build (see tmp/diag-mac.md).  Keep it non-gating, but
      # record the failure in the environment so the debug steps below run.
      run: |
        if nix-build nixpkgs/q-pkgs.nix -A pkgs-cpsless-clang-ucxless.qlat-tests -j 1 --cores 3 --keep-failed ; then
            echo "QLAT_GPT_TESTS_FAILED=0" >> "$GITHUB_ENV"
            echo "Nix GPT/CPS tests passed"
        else
            echo "QLAT_GPT_TESTS_FAILED=1" >> "$GITHUB_ENV"
            echo "Failed to run test on Mac with Nix"
        fi
    - name: Check disk space
      run: df -h
    - name: Build qlat with jhub-env
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-cpsless-clang-ucxless.qlat-jhub-env -j 1 --cores 3 --keep-failed
    - name: Check disk space
      run: df -h
    - name: "Debug: dump macOS environment, preserved nix logs and SIGTRAP backtrace"
      # Runs after a gating failure, or after the known-broken non-gating Nix
      # GPT/CPS test step (which records QLAT_GPT_TESTS_FAILED instead of
      # failing the job).  Dumps the macOS/toolchain info, the full per-test
      # logs preserved by --keep-failed, and reruns the first failing GPT test
      # with Grid --debug-signals and under lldb to get a SIGTRAP backtrace.
      if: ${{ failure() || env.QLAT_GPT_TESTS_FAILED == '1' }}
      run: bash scripts/ci-debug-mac-nix-gpt.sh "$RUNNER_TEMP/qlat-debug"
    - name: "Debug: upload macOS failure logs"
      if: ${{ failure() || env.QLAT_GPT_TESTS_FAILED == '1' }}
      uses: actions/upload-artifact@v6
      with:
        name: qlat-debug-logs-build_nix_mac_clang
        path: ${{ runner.temp }}/qlat-debug/
        if-no-files-found: ignore
        retention-days: 14

