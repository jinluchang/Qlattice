name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # Print a native Python traceback on fatal signals (SIGSEGV/SIGABRT/SIGTRAP)
  # instead of dying silently.  The Python-3.14 jobs currently hide the real
  # error; see tmp/recon-findings.md.
  PYTHONFAULTHANDLER: "1"

jobs:

  build_nix_ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-26.05
    - name: Check disk space
      run: df -h
    - name: Build qlat
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-std-ucxless.qlat-env -j 1 --cores 3
    - name: Check disk space
      run: df -h
    - name: Test qlat
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-std-ucxless.qlat-tests -j 1 --cores 3
    - name: Check disk space
      run: df -h
    - name: Build qlat with GPT and CPS
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-ucxless.qlat-env -j 1 --cores 3
    - name: Check disk space
      run: df -h
    - name: Test qlat with GPT and CPS
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-ucxless.qlat-tests -j 1 --cores 3
    - name: Check disk space
      run: df -h
    - name: Build qlat with jhub-env
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-ucxless.qlat-jhub-env -j 1 --cores 3
    - name: Check disk space
      run: df -h
    - uses: actions/upload-artifact@v6
      with:
        name: qlat-docs
        path: result/share/doc/qlat/html
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v4
      with:
        path: result/share/doc/qlat/html
    - uses: actions/upload-artifact@v6
      with:
        name: qlat-packages
        path: result/share/qlat-pypi/*.tar.gz
    - name: Check disk space
      run: df -h

  deploy_docs:
    # Add a dependency to the build job
    needs: build_nix_ubuntu
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build_nix_ubuntu_clang:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-26.05
    - name: Check disk space
      run: df -h
    - name: Build qlat
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-std-clang-ucxless.qlat-env -j 1 --cores 3
    - name: Check disk space
      run: df -h
    - name: Test qlat
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-std-clang-ucxless.qlat-tests -j 1 --cores 3
    - name: Check disk space
      run: df -h
    - name: Build qlat with GPT and CPS
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-clang-ucxless.qlat-env -j 1 --cores 3
    - name: Check disk space
      run: df -h
    - name: Test qlat with GPT and CPS
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-clang-ucxless.qlat-tests -j 1 --cores 3
    - name: Check disk space
      run: df -h
    - name: Build qlat with jhub-env
      run: nix-build nixpkgs/q-pkgs.nix -A pkgs-clang-ucxless.qlat-jhub-env -j 1 --cores 3
    - name: Check disk space
      run: df -h

  build_qlat_ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Show info
      run: |
        whoami
        pwd
        type python3
        type pip3
        qcore/bin/organize-env-path.py
        qcore/bin/show-env.py
    - name: Install Ubuntu packages
      run: |
        sudo apt-get update
        sudo apt-get install -y git bzip2 autoconf unzip
        sudo apt-get install -y python3-full python3-dev
        sudo apt-get install -y libopenmpi-dev ninja-build patchelf libeigen3-dev libgsl-dev zlib1g-dev libssl-dev libmpfr-dev
        sudo apt-get install -y libfftw3-dev
        # sudo apt-get install -y gnuplot poppler-utils
        #
        sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra tex-gyre
    - name: Build default
      run: |
        export num_proc=2
        export prefix=~/qlat-build/default
        ./build.sh
    - name: Show python venv
      run: |
        source ~/qlat-build/default/setenv.sh
        pip3 install Sphinx myst-parser linkify-it-py
        python3 -c "import sys; print(sys.version)"
        python3 -c "import sys; print(sys.path)"
        python3 -c "import numpy as np ; np.show_config()"
        python3 -c 'import sys ; from mesonbuild import mesonmain; sys.exit(mesonmain.main())' --version
        type ninja
        ninja --version
    - name: Build qlat-docs
      run: |
        export num_proc=2
        export prefix=~/qlat-build/default
        ./scripts/qlat-docs.sh
        [ -f /home/runner/qlat-build/default/qlat-docs/share/doc/qlat/html/index.html ]
    - name: Testing pylib qlat
      # Cap this step so a hung worker pool fails the step (and the
      # failure-only debug steps at the end of the job run) instead of
      # burning GitHub's 6 h job limit without producing any log.
      timeout-minutes: 150
      run: |
        export prefix=~/qlat-build/default
        ./scripts/qlat-examples-py.sh
    - name: Testing qlat
      run: |
        export num_proc=2
        export prefix=~/qlat-build/default
        ./scripts/qlat-examples-cpp.sh
    - name: Check log diff
      run: |
        export prefix=~/qlat-build/default
        ./scripts/qlat-examples-diff-new-logs.sh
    - name: Update log
      run: |
        export prefix=~/qlat-build/default
        ./scripts/qlat-examples-update-logs.sh
    - name: Check error
      run: |
        git diff
        ! git diff | grep '^[+-]CHECK: '
    - name: "Debug: dump full test logs and Python/MPI environment"
      # Failure-only: print the complete (untruncated) log of every failed or
      # killed test plus the Python/MPI environment, then upload it as an
      # artifact.  The Makefiles only show `tail -n 100` on failure, which hid
      # the real Python-3.14 exception (tmp/recon-findings.md).
      if: failure()
      run: |
        # -e is on for these steps; keep the environment dump best-effort.
        set +e
        # shellcheck disable=SC1090
        if [ -f ~/qlat-build/default/setenv.sh ] ; then source ~/qlat-build/default/setenv.sh ; fi
        echo "===== Python / MPI environment ====="
        echo "python3: $(command -v python3 || true)"
        python3 -VV || true
        python3 -c "import sys ; print(sys.version) ; print(sys.path)" || true
        python3 -c "import multiprocessing as mp ; print('mp.get_start_method() =', mp.get_start_method()) ; print('mp.get_all_start_methods() =', mp.get_all_start_methods())" || true
        mpiexec --version || true
        ulimit -c || true
        ulimit -a || true
        uname -a || true
        echo "===== full logs of failed/incomplete tests ====="
        bash scripts/ci-debug-collect-logs.sh "$HOME/qlat-build/default" "$RUNNER_TEMP/qlat-debug"
    - name: "Debug: upload failure logs"
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: qlat-debug-logs-build_qlat_ubuntu
        path: ${{ runner.temp }}/qlat-debug/
        if-no-files-found: ignore
        retention-days: 14
  build_qlat_gpt_ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Show info
      run: |
        whoami
        pwd
        type python3
        type pip3
        qcore/bin/organize-env-path.py
