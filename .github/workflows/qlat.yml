        qcore/bin/show-env.py
    - name: Install Brew packages
      run: |
        # brew update
        brew install llvm autoconf automake coreutils flock findutils pkg-config gnu-sed
        brew install open-mpi ninja patchelf eigen@3 gsl zlib openssl@3 mpfr
        brew install fftw
        # brew upgrade
    - name: Build default
      run: |
        export num_proc=3
        export prefix=~/qlat-build/default
        ./build.sh
    - name: Show python venv
      run: |
